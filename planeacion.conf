# ------------------------------------------------------
# SISRECON (Puerto Docker 8084)
# ------------------------------------------------------
<VirtualHost *:80>
        ServerAdmin carlos.mendez@puebla.gob.mx
        ServerName sisrecon.puebla.gob.mx
        ServerAlias www.sisrecon.puebla.gob.mx

        ErrorLog ${APACHE_LOG_DIR}/sisrecon_error.log
        CustomLog ${APACHE_LOG_DIR}/sisrecon_access.log combined

        ProxyPreserveHost On

        ProxyPass / http://127.0.0.1:8084/
        ProxyPassReverse / http://127.0.0.1:8084/

        RequestHeader set X-Forwarded-Proto "http"
        RequestHeader set X-Forwarded-Port "80"

        Redirect 301 /sisrecon /
</VirtualHost>

# ------------------------------------------------------
# ASPEC (Puerto Docker 8085)
# ------------------------------------------------------
<VirtualHost *:80>
        ServerAdmin carlos.mendez@puebla.gob.mx
        ServerName aspec.puebla.gob.mx
        ServerAlias www.aspec.puebla.gob.mx

        ErrorLog ${APACHE_LOG_DIR}/aspec_error.log
        CustomLog ${APACHE_LOG_DIR}/aspec_access.log combined

        # --- Staging Laravel PHP 8.4 (/beta) ---
        ProxyPass /beta http://127.0.0.1:8086/
        ProxyPassReverse /beta http://127.0.0.1:8086/

        # --- Producción Docker (PHP 7.4) ---
        ProxyPreserveHost On
        ProxyPass / http://127.0.0.1:8085/
        ProxyPassReverse / http://127.0.0.1:8085/

        RequestHeader set X-Forwarded-Proto "http"
        RequestHeader set X-Forwarded-Port "80"

        Redirect 301 /aspec /
</VirtualHost>

# --- Staging ASPEC (puerto interno 8086) ---
Listen 8086
<VirtualHost *:8086>
    DocumentRoot /var/www/html/beta_aspec/public
    <Directory /var/www/html/beta_aspec/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ /var/www/html/beta_aspec/public/index.php [L]
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/beta_aspec_error.log
    CustomLog ${APACHE_LOG_DIR}/beta_aspec_access.log combined
</VirtualHost>

