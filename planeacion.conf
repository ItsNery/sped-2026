# ------------------------------------------------------
# PLANEACIÓN
# ------------------------------------------------------
<VirtualHost *:80>
    ServerAdmin nery.pozos@puebla.gob.mx
    DocumentRoot "/var/www/html/planeacion"
    ServerName planeacion.puebla.gob.mx
    ServerAlias planeacion.puebla.gob.mx
    ErrorLog "/var/www/planeacion_error.log"
    TransferLog "/var/www/planeacion_transfer.log"
    CustomLog /var/www/planeacion_access.log combined
    
    <Directory "/var/www/html/planeacion">
        Options Indexes FollowSymLinks
        AllowOverride All
        Allow from all
        Require all granted
    </Directory>

    Alias /temas "/var/www/html/temas/public"
    <Directory "/var/www/html/temas/public">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php/$1 [L]
    </Directory>
    
    # Configuración para el subdirectorio anexo
    Alias /anexo "/var/www/html/anexo_2024"
    <Directory "/var/www/html/anexo_2024">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php/$1 [L]
    </Directory>

    # Configuración para el subdirectorio gestor
    Alias /gestor "/var/www/html/gestor/public"
    <Directory "/var/www/html/gestor/public">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php/$1 [L]
    </Directory>

    Alias /unis "/var/www/html/unis/public"
    <Directory "/var/www/html/unis/public">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php/$1 [L]
    </Directory>
    # Para Evaluador SICIG
    Alias /evaluador-sicig "/var/www/html/evaluador-sicig/public"
    <Directory "/var/www/html/evaluador-sicig/public">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php/$1 [L]
    </Directory>
    Alias /evaluador-sicig-beta "/var/www/html/evaluador-sicig-beta/public"
    <Directory "/var/www/html/evaluador-sicig-beta/public">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php/$1 [L]
    </Directory>
    Alias /betaaspec "/var/www/html/betaaspec/public"
    <Directory "/var/www/html/betaaspec/public">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php/$1 [L]
    </Directory>
    ProxyPreserveHost On
    ProxyPass /informe http://127.0.0.1:8074/
    ProxyPassReverse /informe http://127.0.0.1:8074/

</VirtualHost>

