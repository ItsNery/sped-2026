name: Deploy

on:
  push:
    branches:
      - beta
      - main

concurrency:
  group: sped-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-beta:
    if: github.ref == 'refs/heads/beta'
    runs-on: [self-hosted, actions-runner-sped]

    steps:
      - name: Deploy BETA
        run: |
          set -euo pipefail

          cd /var/www/html/betasped

          DB_HOST="$(sed -n 's/^DB_HOST=//p' .env | head -n 1 | tr -d '\"' | tr -d "'")"
          DB_PORT="$(sed -n 's/^DB_PORT=//p' .env | head -n 1 | tr -d '\"' | tr -d "'")"
          DB_DATABASE="$(sed -n 's/^DB_DATABASE=//p' .env | head -n 1 | tr -d '\"' | tr -d "'")"
          DB_USERNAME="$(sed -n 's/^DB_USERNAME=//p' .env | head -n 1 | tr -d '\"' | tr -d "'")"
          DB_PASSWORD="$(sed -n 's/^DB_PASSWORD=//p' .env | head -n 1 | tr -d '\"' | tr -d "'")"
          BACKUP_DIR="/var/www/html/betasped/storage/public/backups"
          BACKUP_NAME="sped_beta_$(date +%Y-%m-%d_%H-%M-%S)_${GITHUB_SHA}.sql.gz"
          TEMP_BACKUP="/tmp/${BACKUP_NAME}"

          test -f .env
          DUMP_BIN="$(command -v mariadb-dump || command -v mysqldump)"
          test -n "$DB_DATABASE"
          test -n "$DB_USERNAME"

          MYSQL_PWD="$DB_PASSWORD" "$DUMP_BIN" \
            --host="${DB_HOST:-127.0.0.1}" \
            --port="${DB_PORT:-3306}" \
            --user="$DB_USERNAME" \
            --single-transaction \
            --routines \
            --triggers \
            --events \
            --hex-blob \
            "$DB_DATABASE" | gzip > "$TEMP_BACKUP"

          test -s "$TEMP_BACKUP"
          (cd "$(dirname "$TEMP_BACKUP")" && sha256sum "$(basename "$TEMP_BACKUP")") > "${TEMP_BACKUP}.sha256"
          sudo install -d -m 750 -o user_planeacion -g www-data "$BACKUP_DIR"
          sudo mv "$TEMP_BACKUP" "$BACKUP_DIR/$BACKUP_NAME"
          sudo mv "${TEMP_BACKUP}.sha256" "$BACKUP_DIR/$BACKUP_NAME.sha256"
          sudo chown user_planeacion:www-data "$BACKUP_DIR/$BACKUP_NAME" "$BACKUP_DIR/$BACKUP_NAME.sha256"
          sudo chmod 640 "$BACKUP_DIR/$BACKUP_NAME" "$BACKUP_DIR/$BACKUP_NAME.sha256"
          sudo sh -c "cd '$BACKUP_DIR' && sha256sum -c '$BACKUP_NAME.sha256'"
          sudo find "$BACKUP_DIR" -type f -name '*.sql.gz' -mtime +14 -delete
          sudo find "$BACKUP_DIR" -type f -name '*.sha256' -mtime +14 -delete

          git fetch origin
          git reset --hard origin/beta

          sudo chown -R user_planeacion:www-data storage bootstrap/cache
          sudo chmod -R 775 storage bootstrap/cache

          rm -f bootstrap/cache/*.php
          composer install --no-dev --optimize-autoloader
          [ -f /etc/profile ] && . /etc/profile || true
          [ -f "$HOME/.profile" ] && . "$HOME/.profile" || true
          [ -f "$HOME/.bash_profile" ] && . "$HOME/.bash_profile" || true
          [ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc" || true
          hash -r
          if ! command -v node >/dev/null 2>&1 || ! node -e "process.exit(Number(process.versions.node.split('.')[0]) >= 22 ? 0 : 1)"; then
            NVM_CANDIDATES="${NVM_DIR:-} $HOME/.nvm /home/user_planeacion/.nvm /root/.nvm"
            for candidate in $NVM_CANDIDATES; do
              if [ -s "$candidate/nvm.sh" ]; then
                export NVM_DIR="$candidate"
                break
              fi
            done
            if [ -z "${NVM_DIR:-}" ] || [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "No se encontró Node >=22 ni nvm.sh. HOME=$HOME USER=$(id -un)"
              command -v node || true
              node --version || true
              exit 1
            fi
            . "$NVM_DIR/nvm.sh"
            nvm use 24.14.0 || nvm use 24
          fi
          node --version
          npm --version
          npm ci --omit=dev --legacy-peer-deps --no-audit --no-fund
          node -e "require.resolve('puppeteer')"

          php artisan migrate --force

          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear
          php artisan view:clear

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          php artisan storage:link
          php artisan route:clear

          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, actions-runner-sped]

    steps:
      - name: Deploy PRODUCCION
        run: |
          set -euo pipefail

          cd /var/www/html/sped

          DB_HOST="$(sed -n 's/^DB_HOST=//p' .env | head -n 1 | tr -d '\"' | tr -d "'")"
          DB_PORT="$(sed -n 's/^DB_PORT=//p' .env | head -n 1 | tr -d '\"' | tr -d "'")"
          DB_DATABASE="$(sed -n 's/^DB_DATABASE=//p' .env | head -n 1 | tr -d '\"' | tr -d "'")"
          DB_USERNAME="$(sed -n 's/^DB_USERNAME=//p' .env | head -n 1 | tr -d '\"' | tr -d "'")"
          DB_PASSWORD="$(sed -n 's/^DB_PASSWORD=//p' .env | head -n 1 | tr -d '\"' | tr -d "'")"
          BACKUP_DIR="/var/www/html/sped/storage/public/backups"
          BACKUP_NAME="sped_production_$(date +%Y-%m-%d_%H-%M-%S)_${GITHUB_SHA}.sql.gz"
          TEMP_BACKUP="/tmp/${BACKUP_NAME}"

          test -f .env
          DUMP_BIN="$(command -v mariadb-dump || command -v mysqldump)"
          test -n "$DB_DATABASE"
          test -n "$DB_USERNAME"

          MYSQL_PWD="$DB_PASSWORD" "$DUMP_BIN" \
            --host="${DB_HOST:-127.0.0.1}" \
            --port="${DB_PORT:-3306}" \
            --user="$DB_USERNAME" \
            --single-transaction \
            --routines \
            --triggers \
            --events \
            --hex-blob \
            "$DB_DATABASE" | gzip > "$TEMP_BACKUP"

          test -s "$TEMP_BACKUP"
          (cd "$(dirname "$TEMP_BACKUP")" && sha256sum "$(basename "$TEMP_BACKUP")") > "${TEMP_BACKUP}.sha256"
          sudo install -d -m 750 -o user_planeacion -g www-data "$BACKUP_DIR"
          sudo mv "$TEMP_BACKUP" "$BACKUP_DIR/$BACKUP_NAME"
          sudo mv "${TEMP_BACKUP}.sha256" "$BACKUP_DIR/$BACKUP_NAME.sha256"
          sudo chown user_planeacion:www-data "$BACKUP_DIR/$BACKUP_NAME" "$BACKUP_DIR/$BACKUP_NAME.sha256"
          sudo chmod 640 "$BACKUP_DIR/$BACKUP_NAME" "$BACKUP_DIR/$BACKUP_NAME.sha256"
          sudo sh -c "cd '$BACKUP_DIR' && sha256sum -c '$BACKUP_NAME.sha256'"
          sudo find "$BACKUP_DIR" -type f -name '*.sql.gz' -mtime +30 -delete
          sudo find "$BACKUP_DIR" -type f -name '*.sha256' -mtime +30 -delete

          git fetch origin
          git reset --hard origin/main
          sudo chown -R user_planeacion:www-data storage bootstrap/cache
          sudo chmod -R 775 storage bootstrap/cache
          sudo chmod -R g+s storage bootstrap/cache

          rm -f bootstrap/cache/*.php
          composer install --no-dev --optimize-autoloader
          [ -f /etc/profile ] && . /etc/profile || true
          [ -f "$HOME/.profile" ] && . "$HOME/.profile" || true
          [ -f "$HOME/.bash_profile" ] && . "$HOME/.bash_profile" || true
          [ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc" || true
          hash -r
          if ! command -v node >/dev/null 2>&1 || ! node -e "process.exit(Number(process.versions.node.split('.')[0]) >= 22 ? 0 : 1)"; then
            NVM_CANDIDATES="${NVM_DIR:-} $HOME/.nvm /home/user_planeacion/.nvm /root/.nvm"
            for candidate in $NVM_CANDIDATES; do
              if [ -s "$candidate/nvm.sh" ]; then
                export NVM_DIR="$candidate"
                break
              fi
            done
            if [ -z "${NVM_DIR:-}" ] || [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "No se encontró Node >=22 ni nvm.sh. HOME=$HOME USER=$(id -un)"
              command -v node || true
              node --version || true
              exit 1
            fi
            . "$NVM_DIR/nvm.sh"
            nvm use 24.14.0 || nvm use 24
          fi
          node --version
          npm --version
          npm ci --omit=dev --legacy-peer-deps --no-audit --no-fund
          node -e "require.resolve('puppeteer')"

          php artisan migrate --force

          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear
          php artisan view:clear

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          php artisan storage:link
          php artisan route:clear
